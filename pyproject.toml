[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared"
version = "0.1.0"
description = "Reusable components shared across apps (language detection, Trino and ClickHouse queries, Trino -> ClickHouse loads)"
requires-python = ">=3.9"

dependencies = []

[project.optional-dependencies]
language = [
    "fasttext-wheel>=0.9.2",
    "numpy<2",
]
aicoe-etl = [
    "trino",
    "clickhouse-connect>=0.8",
    "pandas",
]
all = [
    "shared[language,aicoe-etl]",
]

[tool.setuptools.packages.find]
include = ["shared*"]